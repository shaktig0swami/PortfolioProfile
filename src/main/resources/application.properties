spring.application.name=PortfolioProfile
server.servlet.context-path=/PortfolioProfile

#Configuring connection string
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bootprofile?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=shAK(ti)

#Configuring hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true